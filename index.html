<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700&family=Sarabun:wght@400;600&display=swap">
<style>
:root{--bg:#eef3f4;--surface:#fff;--ink:#14272e;--muted:#5d727a;--line:#cddadd;--accent:#0e7c86;--accent-ink:#fff;--travel:#e8a33d;--bad:#b3261e;--tint:#e1eef0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b20;--surface:#17272e;--ink:#e6f0f2;--muted:#93a9b0;--line:#2b414a;--accent:#4cc3cd;--accent-ink:#06262a;--travel:#f0b657;--bad:#ff8f86;--tint:#1d333b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b20;--surface:#17272e;--ink:#e6f0f2;--muted:#93a9b0;--line:#2b414a;--accent:#4cc3cd;--accent-ink:#06262a;--travel:#f0b657;--bad:#ff8f86;--tint:#1d333b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Sarabun,"Noto Sans Thai",system-ui,sans-serif}
h1,h2,.num{font-family:Prompt,Sarabun,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;margin-bottom:18px}
h1{font-size:1.7rem;margin:0;flex:1 1 100%;font-weight:700}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:2px}
input,button,textarea{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],input[type=time]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:42px}
input:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:42px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.tab{white-space:nowrap;text-align:left;line-height:1.3;padding:6px 14px}
.tab small{display:block;color:var(--muted);font-size:.78rem}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected=true] small{color:inherit;opacity:.85}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.panel h2{font-size:1.05rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dur{display:flex;gap:6px;align-items:center}.dur span{color:var(--muted);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--tint);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:Prompt,sans-serif;font-size:1.25rem;font-weight:700}
.stat span{font-size:.82rem;color:var(--muted)}
ol.tl{list-style:none;margin:0;padding:0}
.travel{margin:0 0 0 76px;padding:4px 0 4px 18px;border-left:3px dashed var(--travel);color:var(--muted);font-size:.9rem}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.time{font-family:Prompt,sans-serif;font-weight:700;text-align:right;line-height:1.25}
.time small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.card{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:10px 12px;background:var(--bg)}
.card h3{margin:0;font-size:1.05rem}
.card p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.warn{color:var(--bad);font-weight:600;font-size:.88rem}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acts button{min-height:34px;padding:2px 10px;font-size:.85rem}
.empty{color:var(--muted);text-align:center;padding:22px 8px}
textarea{width:100%;min-height:120px;height:360px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media (max-width:520px){.item{grid-template-columns:54px 1fr}.travel{margin-left:66px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Plan Trip</h1>
  <div style="flex:2 1 220px"><label for="tname">ชื่อทริป</label><input type="text" id="tname"></div>
  <div style="flex:1 1 150px"><label for="tdate">วันเริ่มเดินทาง</label><input type="date" id="tdate"></div>
<div class='row' style='flex:1 1 100%;margin:0;align-items:center'><button id='theme'>โหมดสี</button><button id='exp'>ส่งออก Excel</button><button id='imp'>นำเข้า Excel</button><input type='file' id='file' accept='.xlsx,.xls' hidden><span id='saved' style='color:var(--muted);font-size:.85rem'></span><span id='fmsg' style='color:var(--muted);font-size:.85rem'></span></div>
</header>

<div class="tabs" id="tabs" role="tablist"></div>

<div class="panel" id="dayInfo">
  <div class="grid">
    <div><label for="dstart">เวลาออกเดินทางของวันนี้</label><input type="time" id="dstart"></div>
    <div style="align-self:end;display:flex;gap:8px"><button id="addDay">+ เพิ่มวัน</button><button id="delDay" class="danger">ลบวันนี้</button></div>
  </div>
</div>

<div class="stats" id="stats"></div>

<div class="panel">
  <ol class="tl" id="tl"></ol>
</div>

<div class="panel">
  <h2 id="formTitle">เพิ่มรายการ</h2>
  <div class="grid">
    <div style="grid-column:1/-1"><label for="iname">ชื่อรายการ / สถานที่</label><input type="text" id="iname" placeholder="เช่น วัดพระแก้ว"></div>
    <div style="grid-column:1/-1"><label for="inote">โน้ต (ไม่บังคับ)</label><input type="text" id="inote"></div>
    <div><label>เวลาเดินทางมาถึงที่นี่</label><div class="dur"><input type='text' inputmode='numeric' maxlength='2' id='th' value='00' aria-label='ชั่วโมงเดินทาง'><span>ชม.</span><input type='text' inputmode='numeric' maxlength='2' id='tm' value='00' aria-label='นาทีเดินทาง'><span>นาที</span></div></div>
    <div><label>ใช้เวลาที่นี่</label><div class="dur"><input type='text' inputmode='numeric' maxlength='2' id='sh' value='01' aria-label='ชั่วโมงที่อยู่'><span>ชม.</span><input type='text' inputmode='numeric' maxlength='2' id='sm' value='00' aria-label='นาทีที่อยู่'><span>นาที</span></div></div>
    <div><label for="ifix">กำหนดเวลาถึงเอง (ไม่บังคับ)</label><input type="time" id="ifix"></div>
  </div>
  <div class="row"><button class="primary" id="save">เพิ่มรายการ</button><button id="cancel" hidden>ยกเลิกการแก้ไข</button></div>
</div>

<div class="panel">
  <h2>สรุปแผนเพื่อคัดลอก</h2>
  <textarea id="out" readonly aria-label="สรุปแผน"></textarea>
  <div class="row"><button id="copy">คัดลอก</button><span id="msg" style="align-self:center;color:var(--muted)"></span></div>
</div>
</div>

<script src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'></script>
<script>
var KEY="trip-planner-v1";
var S={name:"ทริปของฉัน",date:"",cur:0,days:[{start:"08:00",items:[]}]};
var edit=-1;
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.days&&p.days.length)S=p;}}catch(e){}
if(!S.date){S.date=new Date().toISOString().slice(0,10);}
function save(){var ok=true;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){ok=false;}var el=document.getElementById('saved');if(el){var n=new Date();el.textContent=ok?'บันทึกอัตโนมัติแล้ว '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'):'เบราว์เซอร์เก็บข้อมูลไม่ได้ ใช้ส่งออก Excel เพื่อเก็บไว้';}}
function $(id){return document.getElementById(id);}
function toMin(t){if(!t)return null;var a=t.split(":");return +a[0]*60+ +a[1];}
function fmt(m){m=Math.round(m);var d=Math.floor(m/1440);m=((m%1440)+1440)%1440;var s=String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");return {t:s,next:d};}
function dur(m){var h=Math.floor(m/60),n=m%60;return (h?h+" ชม. ":"")+(n||!h?n+" นาที":"");}
function dayDate(i){var d=new Date(S.date+"T00:00:00");d.setDate(d.getDate()+i);return isNaN(d)?"":d.toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"});}
function calc(day){
  var cur=toMin(day.start)||0,res=[],tTravel=0,tStay=0,tWait=0;
  day.items.forEach(function(it,i){
    var arrive=cur+it.travel;tTravel+=it.travel;var warn="",wait=0;
    var fx=toMin(it.fix);
    if(fx!==null){
      if(fx>=arrive){wait=fx-arrive;tWait+=wait;arrive=fx;}
      else{warn="มาถึงไม่ทัน เกินเวลาที่กำหนด "+dur(arrive-fx);}
    }
    var end=arrive+it.stay;tStay+=it.stay;
    res.push({arrive:arrive,end:end,warn:warn,wait:wait});cur=end;
  });
  return {rows:res,end:cur,tTravel:tTravel,tStay:tStay,tWait:tWait,start:toMin(day.start)||0};
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function render(){
  $("tname").value=S.name;$("tdate").value=S.date;
  var tabs=$("tabs");tabs.innerHTML="";
  S.days.forEach(function(d,i){
    var b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");b.setAttribute("aria-selected",i===S.cur);
    b.innerHTML="วันที่ "+(i+1)+"<small>"+esc(dayDate(i))+"</small>";
    b.onclick=function(){S.cur=i;cancelEdit();save();render();};tabs.appendChild(b);
  });
  var day=S.days[S.cur];$("dstart").value=day.start;
  var c=calc(day),e=fmt(c.end);
  $("stats").innerHTML=
    '<div class="stat"><b>'+(day.items.length?e.t+(e.next?" (+"+e.next+" วัน)":""):"–")+'</b><span>เวลากลับถึง/จบวัน</span></div>'+
    '<div class="stat"><b>'+dur(c.end-c.start)+'</b><span>รวมทั้งวัน</span></div>'+
    '<div class="stat"><b>'+dur(c.tStay)+'</b><span>เวลาในสถานที่</span></div>'+
    '<div class="stat"><b>'+dur(c.tTravel)+'</b><span>เวลาเดินทาง</span></div>'+
    (c.tWait?'<div class="stat"><b>'+dur(c.tWait)+'</b><span>เวลารอ</span></div>':"");
  var tl=$("tl");tl.innerHTML="";
  if(!day.items.length){tl.innerHTML='<li class="empty">ยังไม่มีรายการ เพิ่มจุดแรกของวันนี้ด้านล่าง</li>';}
  day.items.forEach(function(it,i){
    var r=c.rows[i],a=fmt(r.arrive),en=fmt(r.end);
    if(it.travel>0){var tv=document.createElement("li");tv.className="travel";tv.textContent="เดินทาง "+dur(it.travel);tl.appendChild(tv);}
    if(r.wait>0){var w=document.createElement("li");w.className="travel";w.textContent="รอ "+dur(r.wait);tl.appendChild(w);}
    var li=document.createElement("li");li.className="item";
    li.innerHTML='<div class="time">'+a.t+'<small>ถึง</small></div><div class="card"><h3>'+esc(it.name)+'</h3>'+
      '<p>อยู่ '+dur(it.stay)+' · ออก '+en.t+(en.next?" (+"+en.next+")":"")+'</p>'+(it.note?'<p>'+esc(it.note)+'</p>':"")+
      (r.warn?'<div class="warn">'+r.warn+'</div>':"")+'<div class="acts"></div></div>';
    var acts=li.querySelector(".acts");
    [["↑",function(){mv(i,-1);}],["↓",function(){mv(i,1);}],["แก้ไข",function(){startEdit(i);}],["ลบ",function(){day.items.splice(i,1);cancelEdit();save();render();},"danger"]].forEach(function(x){
      var b=document.createElement("button");b.textContent=x[0];if(x[2])b.className=x[2];b.onclick=x[1];if(x[0]==="↑")b.setAttribute("aria-label","เลื่อนขึ้น");if(x[0]==="↓")b.setAttribute("aria-label","เลื่อนลง");acts.appendChild(b);});
    tl.appendChild(li);
  });
  $("delDay").disabled=S.days.length<2;
  $("out").value=summary();
}
function mv(i,d){var a=S.days[S.cur].items,j=i+d;if(j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t;cancelEdit();save();render();}
function val(id){return Math.max(0,parseInt($(id).value,10)||0);}
function startEdit(i){
  var it=S.days[S.cur].items[i];edit=i;
  $("iname").value=it.name;$("inote").value=it.note||"";
  $('th').value=String(Math.floor(it.travel/60)).padStart(2,'0');$('tm').value=String(it.travel%60).padStart(2,'0');
  $('sh').value=String(Math.floor(it.stay/60)).padStart(2,'0');$('sm').value=String(it.stay%60).padStart(2,'0');$("ifix").value=it.fix||"";
  $("formTitle").textContent="แก้ไขรายการ";$("save").textContent="บันทึกการแก้ไข";$("cancel").hidden=false;
  $("iname").focus();
}
function cancelEdit(){
  edit=-1;$("iname").value="";$("inote").value="";$('th').value='00';$('tm').value='00';$('sh').value='01';$('sm').value='00';$("ifix").value="";
  $("formTitle").textContent="เพิ่มรายการ";$("save").textContent="เพิ่มรายการ";$("cancel").hidden=true;
}
function summary(){
  var out=S.name+"\n";
  S.days.forEach(function(d,i){
    out+="\nวันที่ "+(i+1)+" ("+dayDate(i)+") ออกเดินทาง "+d.start+"\n";
    var c=calc(d);
    d.items.forEach(function(it,k){
      var r=c.rows[k];out+=fmt(r.arrive).t+"–"+fmt(r.end).t+"  "+it.name+(it.travel?" (เดินทาง "+dur(it.travel)+")":"")+"\n";
    });
    if(d.items.length)out+="จบวัน "+fmt(c.end).t+" · รวม "+dur(c.end-c.start)+"\n";
  });
  return out;
}
$("save").onclick=function(){
  var name=$("iname").value.trim();
  if(!name){$("iname").focus();$("iname").setCustomValidity&&0;$("msg").textContent="กรอกชื่อรายการก่อนบันทึก";return;}
  $("msg").textContent="";
  var it={name:name,note:$("inote").value.trim(),travel:val("th")*60+val("tm"),stay:val("sh")*60+val("sm"),fix:$("ifix").value};
  var a=S.days[S.cur].items;if(edit>=0)a[edit]=it;else a.push(it);
  cancelEdit();save();render();
};
$("cancel").onclick=cancelEdit;
$("tname").oninput=function(){S.name=this.value;save();$("out").value=summary();};
$("tdate").onchange=function(){if(this.value){S.date=this.value;save();render();}};
$("dstart").onchange=function(){S.days[S.cur].start=this.value||"08:00";save();render();};
$("addDay").onclick=function(){S.days.push({start:S.days[S.cur].start,items:[]});S.cur=S.days.length-1;cancelEdit();save();render();};
$("delDay").onclick=function(){if(S.days.length<2)return;var b=$('delDay');if(!b.dataset.arm){b.dataset.arm='1';b.textContent='กดอีกครั้งเพื่อลบ';setTimeout(function(){delete b.dataset.arm;b.textContent='ลบวันนี้';},3000);return;}delete b.dataset.arm;b.textContent='ลบวันนี้';S.days.splice(S.cur,1);S.cur=Math.max(0,S.cur-1);cancelEdit();save();render();};
$("copy").onclick=function(){
  var t=$("out");t.select();var ok=false;
  try{ok=document.execCommand("copy");}catch(e){}
  $("msg").textContent=ok?"คัดลอกแล้ว":"เลือกข้อความไว้แล้ว กดคัดลอกด้วยเครื่องของคุณ";
};
var TK='trip-theme',mode='auto';try{mode=localStorage.getItem(TK)||'auto';}catch(e){}
function applyTheme(){var r=document.documentElement;if(mode==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',mode);$('theme').textContent='โหมดสี: '+{auto:'ตามระบบ',light:'ขาว',dark:'ดำ'}[mode];}
$('theme').onclick=function(){mode=mode==='auto'?'light':mode==='light'?'dark':'auto';try{localStorage.setItem(TK,mode);}catch(e){}applyTheme();};
function note(t){$('fmsg').textContent=t;}
function normTime(v){if(typeof v==='number'&&v>=0&&v<1){return fmt(Math.round(v*1440)).t;}var s=String(v==null?'':v).trim(),p=s.split(':');if(p.length<2)return '';var h=parseInt(p[0],10),mi=parseInt(p[1],10);if(isNaN(h)||isNaN(mi)||h>23||mi>59)return '';return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');}
async function exportXlsx(){if(typeof XLSX==='undefined'){note('โหลดตัวสร้างไฟล์ Excel ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่');return;}var dl=null;try{dl=window.claude?await window.claude.use('downloads'):null;}catch(e){}if(false){note('ส่งออกไฟล์ไม่ได้ในมุมมองนี้ ลองเปิดหน้านี้ใน claude.ai');return;}var rows=[['วัน','เวลาออกเดินทาง','ลำดับ','ชื่อรายการ','โน้ต','เดินทาง (นาที)','ใช้เวลา (นาที)','เวลาถึงที่กำหนด','เวลาถึง','เวลาออก']];S.days.forEach(function(d,i){var c=calc(d);if(!d.items.length)rows.push([i+1,d.start,'','','','','','','','']);d.items.forEach(function(it,k){var r=c.rows[k];rows.push([i+1,d.start,k+1,it.name,it.note||'',it.travel,it.stay,it.fix||'',fmt(r.arrive).t,fmt(r.end).t]);});});var wb=XLSX.utils.book_new();var ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:6},{wch:14},{wch:8},{wch:28},{wch:28},{wch:14},{wch:14},{wch:16},{wch:10},{wch:10}];XLSX.utils.book_append_sheet(wb,ws,'แผน');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['ชื่อทริป','วันเริ่มเดินทาง'],[S.name,S.date]]),'ทริป');var buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});if(!dl){if(window.top!==window.self){note('ส่งออกไม่ได้ในกรอบนี้ ให้เปิดหน้านี้แบบเต็มหน้า หรือเปิดไฟล์ HTML โดยตรงในเบราว์เซอร์');return;}try{var fn=((S.name||'trip').replace(/[^a-zA-Z0-9ก-๙ _-]/g,'')||'trip')+'.xlsx';var bl=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});var u=URL.createObjectURL(bl);var a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u);},4000);note('ส่งออกแล้ว');}catch(e){note('บันทึกไฟล์ไม่สำเร็จ');}return;}
try{await dl.save({filename:((S.name||'trip').replace(/[^a-zA-Z0-9ก-๙ _-]/g,'')||'trip')+'.xlsx',data:buf});note('ส่งออกแล้ว');}catch(e){note(e&&e.code==='declined'?'ยกเลิกการบันทึกไฟล์':'บันทึกไฟล์ไม่สำเร็จ');}}
function importXlsx(file){if(typeof XLSX==='undefined'){note('โหลดตัวอ่านไฟล์ Excel ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่');return;}var fr=new FileReader();fr.onload=function(){try{var wb=XLSX.read(fr.result,{type:'array'});var ws=wb.Sheets['แผน']||wb.Sheets[wb.SheetNames[0]];var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});var map={},order=[];for(var i=1;i<rows.length;i++){var r=rows[i],dn=parseInt(r[0],10);if(!dn||dn<1)continue;if(!map[dn]){map[dn]={start:normTime(r[1])||'08:00',items:[]};order.push(dn);}var nm=String(r[3]||'').trim();if(nm)map[dn].items.push({name:nm,note:String(r[4]||'').trim(),travel:Math.max(0,parseInt(r[5],10)||0),stay:Math.max(0,parseInt(r[6],10)||0),fix:normTime(r[7])});}if(!order.length){note('ไม่พบข้อมูลวันในไฟล์ ใช้ไฟล์ที่ส่งออกจากหน้านี้');return;}order.sort(function(a,b){return a-b;});var days=order.map(function(k){return map[k];});var nameV=S.name,dateV=S.date,info=wb.Sheets['ทริป'];if(info){var ir=XLSX.utils.sheet_to_json(info,{header:1,defval:''});if(ir[1]){if(ir[1][0])nameV=String(ir[1][0]);var d=ir[1][1];if(typeof d==='number')d=new Date(Math.round((d-25569)*864e5)).toISOString().slice(0,10);d=String(d).slice(0,10);if(d.length===10&&!isNaN(new Date(d)))dateV=d;}}S={name:nameV,date:dateV,cur:0,days:days};cancelEdit();save();render();note('นำเข้าแล้ว '+days.length+' วัน (แทนที่ข้อมูลเดิม)');}catch(e){note('อ่านไฟล์ไม่สำเร็จ ตรวจว่าเป็นไฟล์ .xlsx');}};fr.readAsArrayBuffer(file);}
$('exp').onclick=exportXlsx;$('imp').onclick=function(){$('file').click();};$('file').onchange=function(){if(this.files[0])importXlsx(this.files[0]);this.value='';};
$('saved').textContent='ข้อมูลบันทึกอัตโนมัติในเบราว์เซอร์นี้';
['th','tm','sh','sm'].forEach(function(id){var el=$(id);el.addEventListener('input',function(){this.value=this.value.replace(/[^0-9]/g,'').slice(0,2);});el.addEventListener('blur',function(){var n=parseInt(this.value,10)||0;if(id==='tm'||id==='sm')n=Math.min(n,59);this.value=String(n).padStart(2,'0');});el.addEventListener('focus',function(){this.select();});});
applyTheme();
render();
</script>
</body>
</html>
